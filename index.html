                    const data = snapshot.docs.map(doc => doc.data());
                    data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                    setDb(prev => ({ ...prev, observations: data }));
                }, (err) => console.error(err));

                const unsubLogs = onSnapshot(logsRef, (snapshot) => {
                    const data = snapshot.docs.map(doc => doc.data());
                    data.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                    setDb(prev => ({ ...prev, audit_logs: data }));
                }, (err) => console.error(err));

                const unsubTeachers = onSnapshot(teachersRef, (snapshot) => {
                    let data = snapshot.docs.map(doc => doc.data());
                    if (data.length > 0) {
                        data.sort((a, b) => {
                            return (a.sort_order || 0) - (b.sort_order || 0);
                        });
                        setDb(prev => ({ ...prev, teachers: data }));
                    } else {
                        MOCK_TEACHERS.forEach(t => {
                            setDoc(fireDoc(fireDB, 'teachers', t.id), t);
                        });
                    }
                }, (err) => console.error(err));

                return () => {
                    unsubObs(); unsubLogs(); unsubTeachers();
                };

                    const obsToDelete = db.observations.find(o => o.id === id);

                        ...prev,
                        observations: prev.observations.filter(o => o.id !== id)

                            logAudit('DELETE', 'observations', id, null, obsToDelete);

                            console.error("Gagal memadam dari awan", e);
                        }
                    } else {
                        logAudit('DELETE', 'observations', id, null, obsToDelete);
                        setToastMessage({ type: 'warning', text: 'Rekod dipadam dari memori (Mod Offline).' });
                    }
                    setTimeout(() => setToastMessage(null), 3000);

                    if (filteredObs.length === 0) return;
                    const idsToDelete = filteredObs.map(o => o.id);

                        ...prev,
                        observations: prev.observations.filter(o => !idsToDelete.includes(o.id))

                    if (isCloudReady && window.firebaseAPI) {

                        try {
                            await Promise.all(idsToDelete.map(async (id, index) => {
                                await deleteDoc(fireDoc(fireDB, 'observations', id));

                            }));
                            setToastMessage({ type: 'warning', text: `${idsToDelete.length} rekod telah dipadam.` });

                            console.error("Gagal memadam secara pukal", e);

                        idsToDelete.forEach((id, index) => {

                                                                    <button onClick={() => setDeleteConfirm(obs.id)} className="p-2 bg-rose-50 text-rose-500 rounded-xl hover:bg-rose-500 hover:text-white transition-all shadow-sm" title="Padam">
                                                                        <i className="ph ph-trash text-xl"></i>
                                                                    </button>

                                                            </td>

                                                </tbody>

                        teacherObj = {
                            ...existing,
                            teacher_name: newTeacherForm.teacher_name,
                            ic_no: newTeacherForm.ic_no,
                            position: newTeacherForm.position,
                            option: newTeacherForm.option
                        };
                    } else {
                        teacherObj = {
                            id: generateUUID(),
                            user_id: null,
                            school_id: currentUser.school_id,
                            teacher_name: newTeacherForm.teacher_name,
                            staff_id: 'STF' + Math.floor(Math.random() * 1000),
                            ic_no: newTeacherForm.ic_no,
                            position: newTeacherForm.position,
                            option: newTeacherForm.option,
                            specialization: 'Umum',
                            class_name: '-',
                            subject: '-',
                            is_active: true,
                            sort_order: db.teachers.length + 1
                        };

                    setDb(prev => {

                        if (isEditing) {
                            updatedTeachers = prev.teachers.map(t => t.id === editingTeacherId ? teacherObj : t);

                        return { ...prev, teachers: updatedTeachers };

                        const { db: fireDB, doc: fireDoc, setDoc } = window.firebaseAPI;
                        try {

                            setToastMessage({ type: 'success', text: `Rekod guru berjaya ${isEditing ? 'dikemaskini' : 'ditambah'}!` });

                            console.error(err);

                        logAudit(isEditing ? 'UPDATE' : 'CREATE', 'teachers', teacherObj.id, teacherObj);
